name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install ruff
      - run: ruff check backend cli sdk/python examples

  python-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install packages
        run: >-
          python -m pip install
          -e "./backend[dev,sqlite]"
          -e "./sdk/python[dev,openai,anthropic]"
          -e ./cli
      # The real-client instrumentor tests (evaluation C1) and the Anthropic judge test skip
      # without these packages; installing them keeps the regressions gated.
      - name: Backend tests
        run: python -m pytest tests -q
        working-directory: backend
      - name: Python SDK tests
        run: python -m pytest tests -q
        working-directory: sdk/python
      - name: CLI tests
        run: python -m pytest tests -q
        working-directory: cli

  python-310:
    # The packages declare requires-python >=3.10; this runs the same suites on the oldest one
    # (evaluation A1: 3.10's datetime.fromisoformat accepts fewer ISO 8601 forms than 3.11).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
          cache: pip
      - name: Install packages
        run: >-
          python -m pip install
          -e "./backend[dev,sqlite]"
          -e "./sdk/python[dev,openai,anthropic]"
          -e ./cli
      - name: Backend tests
        run: python -m pytest tests -q
        working-directory: backend
      - name: Python SDK tests
        run: python -m pytest tests -q
        working-directory: sdk/python
      - name: CLI tests
        run: python -m pytest tests -q
        working-directory: cli

  agent-scenarios:
    # Six agent scenarios through the SDK into a running backend (SQLite), read back through the
    # API: the end-to-end check of the 2026-10-18 evaluation. Model calls use a mocked transport.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e "./backend[sqlite]" -e "./sdk/python[anthropic]"
      - name: Start the backend and run the scenarios
        env:
          DATABASE_URL: sqlite+aiosqlite:///./scenarios.db
          OBSERVATORY_ALERTS: "0"
          OBSERVATORY_AUTO_EVAL: "0"
        run: |
          (cd backend && alembic upgrade head && (uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../backend.log 2>&1 &))
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && break; sleep 1; done
          python scripts/agent_scenarios.py --endpoint http://127.0.0.1:8000 --slow-seconds 2 || (cat backend.log; exit 1)
          python examples/orchestrator/run_bed.py --endpoint http://127.0.0.1:8000 || (cat backend.log; exit 1)

  sqlite-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[sqlite]"
        working-directory: backend
      - name: Upgrade, downgrade, and re-upgrade
        working-directory: backend
        env:
          DATABASE_URL: sqlite+aiosqlite:///./migration-smoke.db
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

  postgres-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: observatory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d observatory_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e .
        working-directory: backend
      - name: Upgrade, downgrade, and re-upgrade
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/observatory_test
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: |
            sdk/typescript/package-lock.json
            dashboard/package-lock.json
      - name: SDK typecheck and tests
        working-directory: sdk/typescript
        run: |
          npm ci
          npm audit --audit-level=high
          npx tsc --noEmit
          npm run test:run
      - name: Dashboard regression tests, typecheck and build
        working-directory: dashboard
        run: |
          npm ci
          npm audit --audit-level=high
          npm run build
          npm test

  dashboard-e2e:
    # The dashboard in a real browser (external evaluation B3): every page in Spanish and English
    # without JavaScript errors, and the main flows, against a backend loaded with the test bed.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      # run_bed.py sends one of its formats through the Python SDK
      - run: python -m pip install -e "./backend[sqlite]" -e ./sdk/python
      - name: Start the backend and load the test bed
        env:
          DATABASE_URL: sqlite+aiosqlite:///./e2e.db
          OBSERVATORY_ALERTS: "0"
          OBSERVATORY_AUTO_EVAL: "0"
        run: |
          (cd backend && alembic upgrade head && (uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../backend.log 2>&1 &))
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && break; sleep 1; done
          python examples/orchestrator/run_bed.py --endpoint http://127.0.0.1:8000 || (cat backend.log; exit 1)
      - name: Build the dashboard and run the browser tests
        working-directory: dashboard
        env:
          OBSERVER_API_URL: http://127.0.0.1:8000
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
          npm run e2e
      - name: Keep the report of a failed run
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard-e2e-report
          path: |
            dashboard/playwright-report
            dashboard/test-results
            backend.log
          retention-days: 7
