name: Bug report
description: Report reproducible incorrect behavior in Observer
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Observer. Remove credentials, personal data,
        prompts, model responses, and private URLs before submitting logs.
  - type: input
    id: version
    attributes:
      label: Observer version
      description: Release tag, package version, or commit SHA.
      placeholder: v0.1.1
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Backend API
        - Dashboard
        - Python SDK
        - TypeScript SDK
        - CLI
        - Container or deployment
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide synthetic inputs and the smallest sequence that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python or Node version, database, and deployment method. Do not paste an environment dump.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed secrets, personal data, private URLs, and real trace content.
          required: true
